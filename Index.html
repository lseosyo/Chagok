<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제목 미정</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1a1a1a;
  --muted: #8a8a8a;
  --line: #e5e5e5;
  --accent: #1a1a1a;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161616;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --line: #2e2e2e;
    --accent: #f2f2f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161616;
  --text: #f2f2f2;
  --muted: #8a8a8a;
  --line: #2e2e2e;
  --accent: #f2f2f2;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
h1 { margin: 0 0 20px; font-size: 0.82rem; font-weight: 600; line-height: 1.6; text-align: center; word-break: keep-all; overflow-wrap: anywhere; max-width: 100%; padding: 0 4px; box-sizing: border-box; }
nav {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
nav button {
  -webkit-tap-highlight-color: transparent;
  outline: none;
  flex: 1;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 12px 8px;
  font: inherit;
  font-size: 1rem;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
nav button[aria-selected="true"] {
  color: var(--text);
  font-weight: 600;
  border-bottom-color: var(--accent);
}
.panel { display: none; padding-top: 20px; }
.panel.active { display: block; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-title { font-size: 1.1rem; font-weight: 600; }
.cal-head button { background: none; border: none; outline: none; color: var(--text); font: inherit; font-size: 1.3rem; padding: 4px 12px; cursor: pointer; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 0.8rem; color: var(--muted); padding: 6px 0; }
.cal-day { width: min(100%, 40px); aspect-ratio: 1; justify-self: center; display: flex; align-items: center; justify-content: center; background: none; border: none; border-radius: 50%; outline: none; color: var(--text); font: inherit; font-size: 0.95rem; line-height: 1; cursor: pointer; padding: 0; }
.cal-day.sel { background: #c8c8c8; color: #000; }
.cal-day.today { background: #000; color: #fff; }
.pills { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.pill { width: 100%; box-sizing: border-box; padding: 6px 6px 6px 20px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; min-height: 34px; line-height: 1; background: #c8c8c8; color: #000; font-size: 0.95rem; }
.pill-btn { position: relative; width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: none; outline: none; background: #fff; padding: 0; cursor: pointer; }
.pill-btn::before, .pill-btn::after { content: ""; position: absolute; top: 50%; left: 50%; background: #000; transform: translate(-50%, -50%); }
.pill-btn::before { width: 10px; height: 2px; }
.pill-btn::after { width: 2px; height: 10px; }
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 20; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 720px; height: 50vh; box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.2); transform: translateY(100%); transition: transform 0.3s ease; z-index: 21; }
.sheet.open { transform: translateY(0); }
.sheet:not(.open) { box-shadow: none; }
.todos:empty { display: none; }
.todo { padding: 2px 20px; cursor: pointer; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.todo.dragging { position: relative; z-index: 5; background: var(--bg); border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); }
.todo-title { font-size: 0.95rem; flex: 1; min-width: 0; }
.memo-toggle { position: relative; width: 30px; height: 18px; flex-shrink: 0; border: none; border-radius: 999px; background: #c8c8c8; padding: 0; cursor: pointer; outline: none; }
.memo-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left 0.2s ease; }
.memo-toggle.on { background: var(--c); }
.memo-toggle.on::after { left: 20px; }
.todo-memo { font-size: 0.8rem; color: var(--muted); margin: 2px 0 0 26px; white-space: pre-wrap; }
.todo-head { display: flex; align-items: center; gap: 8px; }
.todo-check { position: relative; box-sizing: border-box; width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--c); background: transparent; padding: 0; cursor: pointer; outline: none; }
.todo-check.done { background: var(--c); }
.sheet-body { padding: 24px 20px; }
.sheet-body label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
.sheet-body input, .sheet-body textarea { width: 100%; box-sizing: border-box; padding: 12px 20px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--text); font: inherit; font-size: 16px; outline: none; }
.sheet-body button { width: 100%; padding: 12px; border: none; border-radius: 999px; background: var(--accent); color: var(--bg); font: inherit; font-size: 1rem; cursor: pointer; outline: none; }
.pill-label { display: flex; align-items: center; gap: 8px; }
.dot { display: block; width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.sheet-body button + button { margin-top: 12px; }
#todo-edit, #todo-cat, #todo-move, #todo-delete { background: #e2e2e2; color: #000; }
#cat-sheet { z-index: 22; }
.cat-list { display: flex; flex-direction: column; gap: 10px; }
#cat-sheet .cat-item { display: flex; align-items: center; gap: 10px; margin: 0; padding: 12px 20px; background: #e2e2e2; color: #000; text-align: left; }
#cat-sheet .cat-item.on { background: var(--accent); color: var(--bg); }
.sheet.small { height: auto; max-height: 90vh; overflow-y: auto; }
.move-cal { padding: 24px 20px 0; }
.confirm-msg { margin: 0 0 20px; text-align: center; font-size: 1rem; }
.sheet-body textarea { display: block; border-radius: 24px; resize: none; line-height: 1.4; }
.label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.label-row label { margin-bottom: 0; }
.sheet-body .memo-toggle { width: 42px; height: 24px; padding: 0; border-radius: 999px; background: #c8c8c8; }
.sheet-body .memo-toggle.on { background: var(--accent); }
.sheet-body .memo-toggle.on::after { background: var(--bg); }
.sheet { overflow-y: auto; }
.memo-collapse { display: grid; grid-template-rows: 0fr; margin-bottom: 12px; transition: grid-template-rows 0.25s ease; }
.memo-collapse.open { grid-template-rows: 1fr; }
.memo-collapse > div { overflow: hidden; min-height: 0; }
.memo-collapse textarea { margin-bottom: 6px; visibility: hidden; transition: visibility 0s linear 0.25s; }
.memo-collapse.open textarea { visibility: visible; transition-delay: 0s; }
.label-row.time { margin-top: 6px; }
.time-row { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; }
.time-row input { flex: 1; min-width: 0; margin-bottom: 0; text-align: center; }
.time-sep { color: var(--muted); }
.memo-collapse input { visibility: hidden; transition: visibility 0s linear 0.25s; }
.memo-collapse.open input { visibility: visible; transition-delay: 0s; }
.todo-time { font-size: 0.8rem; color: var(--muted); margin: 2px 0 0 26px; }
.time-warn { color: #e5484d; font-size: 0.8rem; padding: 0 0 6px 4px; }
.time-warn:empty { display: none; }
.todo-title.done { text-decoration: line-through; }
.label-row.rep { margin-top: 6px; }
.days-row { display: flex; gap: 6px; padding-bottom: 12px; }
.sheet-body .day-chip { margin: 0; flex: 1; width: auto; min-width: 0; aspect-ratio: 1; padding: 0; border-radius: 50%; background: #e2e2e2; color: #000; font-size: 0.9rem; }
.sheet-body .day-chip.on { background: var(--accent); color: var(--bg); }
.sheet-body .end-btn { padding: 12px 20px; background: transparent; color: var(--text); border: 1px solid var(--line); text-align: left; font-size: 16px; margin-bottom: 6px; }
.memo-collapse button { visibility: hidden; transition: visibility 0s linear 0.25s; }
.memo-collapse.open button { visibility: visible; transition-delay: 0s; }
.fab { position: fixed; right: max(20px, calc(50% - 340px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border: none; border-radius: 50%; background: var(--accent); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); padding: 0; cursor: pointer; outline: none; z-index: 10; display: none; }
.fab.show { display: block; }
.fab::before, .fab::after { content: ""; position: absolute; top: 50%; left: 50%; background: var(--bg); transform: translate(-50%, -50%); }
.fab::before { width: 20px; height: 2px; }
.fab::after { width: 2px; height: 20px; }
.swatch-row { display: flex; gap: 10px; padding-bottom: 24px; }
.sheet-body .swatch { margin: 0; flex: 1; width: auto; min-width: 0; max-width: 56px; aspect-ratio: 1; padding: 0; border-radius: 50%; background: var(--c); }
.sheet-body .swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
#subjects .pill { cursor: pointer; }
.subject-page { position: fixed; inset: 0; background: var(--bg); color: var(--text); z-index: 30; display: none; overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.subject-page.open { display: block; }
.subject-page-inner { max-width: 720px; margin: 0 auto; padding: 12px 20px 40px; }
.subject-page-head { display: flex; align-items: center; gap: 8px; }
.subject-back { background: none; border: none; outline: none; color: var(--text); font: inherit; font-size: 1.6rem; line-height: 1; padding: 4px 12px 4px 0; cursor: pointer; }
.subject-page-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.week-row { display: flex; align-items: center; gap: 10px; padding-bottom: 24px; }
.sheet-body .week-row input { width: 110px; margin-bottom: 0; text-align: center; }
.week-unit { font-size: 1rem; }
#week-backdrop { z-index: 40; }
#week-sheet { z-index: 41; }
.week-stats { padding: 10px 20px 4px; display: flex; flex-direction: column; gap: 8px; }
.stat-row { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
.stat-input { width: 64px; height: 34px; box-sizing: border-box; padding: 0; line-height: 34px; display: block; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--text); font: inherit; font-size: 16px; line-height: normal; text-align: center; text-indent: 0; outline: none; }
#week-list:empty { display: none; }
#week-list:not(:empty) + #schedule-box { margin-top: 10px; }
#schedule-backdrop { z-index: 40; }
#schedule-sheet { z-index: 41; }
#due-sheet { z-index: 42; }
.weight-row { display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-top: 24px; font-size: 1rem; }
.diet-title { margin: 28px 0 10px; font-size: 1rem; font-weight: 600; text-align: left; }
.meal-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 1rem; }
#exercise-input { display: block; width: 100%; }
.meal-label { width: 44px; flex-shrink: 0; }
.meal-input { flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--text); font: inherit; font-size: 16px; text-align: left; outline: none; }
#todo-sheet { height: auto; max-height: 90vh; }
.tl-grid { display: grid; grid-template-columns: 30px repeat(6, 1fr); row-gap: 10px; align-items: center; margin-top: 24px; }
.tl-hour { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-cell { position: relative; display: flex; overflow: hidden; width: min(100%, 40px); aspect-ratio: 1; justify-self: center; box-sizing: border-box; border-radius: 50%; background: transparent; }
.tl-cell::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 3px #b5b5b5; pointer-events: none; }
html.tl-lock, html.tl-lock body { overflow: hidden; overscroll-behavior: none; }
.tl-cell { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.tl-cell.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.tl-cell.cur::before { content: attr(data-time); position: absolute; inset: 3px; z-index: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg); color: var(--text); font-size: 0.65rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; pointer-events: none; }
.tl-cell.cat::after { box-shadow: inset 0 0 0 3px var(--cat); }
.tl-cell.cat .tl-seg.past { background: var(--cat); }
.tl-cell.cat.cur:has(.tl-seg:last-child.past)::before { background: transparent; color: var(--cat-text); }
#tl-backdrop { z-index: 40; }
#tl-sheet { z-index: 41; }
#tl-add-sheet { z-index: 42; }
#tl-act-sheet { z-index: 43; }
.archive-list { display: flex; flex-direction: column; gap: 10px; }
.archive-list:empty { display: none; }
#archive-act-sheet { z-index: 22; }
#archive-confirm-sheet { z-index: 23; }
#archive-act-edit, #archive-act-today, #archive-act-delete, #archive-confirm-cancel { background: #e2e2e2; color: #000; }
#tl-confirm-sheet { z-index: 44; }
#tl-act-edit, #tl-act-delete, #tl-confirm-cancel { background: #e2e2e2; color: #000; }
.tl-done-item { cursor: pointer; }
#tl-sheet .sheet-body { padding-top: 12px; }
#tl-sheet .tl-close { position: relative; display: block; width: 36px; height: 36px; margin: 0 0 8px auto; padding: 0; background: transparent; border-radius: 50%; }
#tl-sheet .tl-close::before, #tl-sheet .tl-close::after { content: ""; position: absolute; top: 50%; left: 50%; width: 18px; height: 2px; background: var(--text); }
#tl-sheet .tl-close::before { transform: translate(-50%, -50%) rotate(45deg); }
#tl-sheet .tl-close::after { transform: translate(-50%, -50%) rotate(-45deg); }
.tl-sugg { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.tl-sugg-label { flex-shrink: 0; font-size: 1rem; }
.tl-done { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; max-height: 30vh; overflow-y: auto; }
.tl-done:empty { display: none; }
.tl-done-item { padding: 12px 18px; border-radius: 20px; background: #e2e2e2; color: #000; }
.tl-done-title { font-size: 0.95rem; font-weight: 600; }
.tl-done-memo { margin-top: 4px; font-size: 0.8rem; color: #555; white-space: pre-wrap; }
.tl-chips { display: flex; gap: 10px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.tl-chips::-webkit-scrollbar { display: none; }
#tl-sheet .tl-chip { flex-shrink: 0; width: auto; display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 18px; background: #e2e2e2; color: #000; font-size: 0.95rem; white-space: nowrap; }
#tl-sheet .tl-chip.on { background: var(--accent); color: var(--bg); }
.tl-seg { flex: 1; min-width: 0; }
.tl-seg + .tl-seg { border-left: 1px solid transparent; }
.tl-seg.past { background: #b5b5b5; }
#end-sheet { z-index: 22; }
#scope-sheet { z-index: 23; }
</style>
</head>
<body>
<div class="wrap">
  <h1>모든 순간에 100% 진심이어야 한다.<br>삶은 몇 번씩 봐주지 않는다.<br>두번 말해주지도 않는다.<br>흘러가면 다신 붙잡지 못하는 기회들</h1>
  <nav role="tablist">
    <button role="tab" aria-selected="true">투두</button>
    <button role="tab" aria-selected="false">타임라인</button>
    <button role="tab" aria-selected="false">건강</button>
    <button role="tab" aria-selected="false">공부</button>
    <button role="tab" aria-selected="false">보관함</button>
  </nav>
  <section class="panel active"><div class="cal"></div>
    <div class="pills" id="todo-pills">
      <div class="pill"><span class="pill-label"><i class="dot" style="background:#BA664C"></i>일정</span><button class="pill-btn" aria-label="일정 버튼"></button></div>
      <div class="todos"></div>
      <div class="pill"><span class="pill-label"><i class="dot" style="background:#262D82"></i>교통</span><button class="pill-btn" aria-label="교통 버튼"></button></div>
      <div class="todos"></div>
      <div class="pill"><span class="pill-label"><i class="dot" style="background:#DBB114"></i>공부</span><button class="pill-btn" aria-label="공부 버튼"></button></div>
      <div class="todos"></div>
      <div class="pill"><span class="pill-label"><i class="dot" style="background:#7C33B0"></i>할일</span><button class="pill-btn" aria-label="할일 버튼"></button></div>
      <div class="todos"></div>
    </div>
  </section>
  <section class="panel"><div class="cal"></div><div class="tl-grid" id="timeline-grid"></div></section>
  <section class="panel"><div class="cal"></div><div class="weight-row"><input id="weight-input" class="stat-input" type="text" inputmode="decimal" maxlength="5" placeholder="00" autocomplete="off" aria-label="체중"><span>kg</span></div>
    <div class="diet-title">식단</div>
    <div class="meal-row"><span class="meal-label">아침:</span><input id="meal-breakfast" class="meal-input" type="text" autocomplete="off" aria-label="아침"></div>
    <div class="meal-row"><span class="meal-label">점심:</span><input id="meal-lunch" class="meal-input" type="text" autocomplete="off" aria-label="점심"></div>
    <div class="meal-row"><span class="meal-label">저녁:</span><input id="meal-dinner" class="meal-input" type="text" autocomplete="off" aria-label="저녁"></div>
    <div class="diet-title">운동</div>
    <input id="exercise-input" class="meal-input" type="text" autocomplete="off" aria-label="운동">
  </section>
  <section class="panel"><div class="pills" id="subjects"></div></section>
  <section class="panel" id="archive-panel"><div class="archive-list" id="archive-list"></div></section>
</div>
<button id="study-fab" class="fab" type="button" aria-label="과목 설정"></button>
<button id="archive-fab" class="fab" type="button" aria-label="보관함 추가"></button>
<div class="subject-page" id="subject-page">
  <div class="subject-page-inner">
    <div class="subject-page-head">
      <button id="subject-back" class="subject-back" type="button" aria-label="뒤로">‹</button>
      <div class="subject-page-title" id="subject-page-title"></div>
    </div>
    <div class="pills" id="week-list"></div>
    <div class="pills" id="schedule-box">
      <div class="pill"><span class="pill-label"><i class="dot" id="schedule-dot"></i>일정</span><button class="pill-btn" id="schedule-btn" type="button" aria-label="일정 버튼"></button></div>
      <div class="todos" id="schedule-list"></div>
    </div>
  </div>
  <button id="week-fab" class="fab show" type="button" aria-label="주차 추가"></button>
</div>
<div class="backdrop" id="week-backdrop"></div>
<div class="backdrop" id="schedule-backdrop"></div>
<div class="sheet small" id="schedule-sheet" role="dialog" aria-modal="true">
  <div class="sheet-body">
    <label for="sch-title" id="sch-title-label">일정</label>
    <input id="sch-title" type="text" autocomplete="off">
    <label for="sch-memo" id="sch-memo-label">메모</label>
    <textarea id="sch-memo" rows="3"></textarea>
    <label id="sch-due-label">기한</label>
    <button id="sch-due-btn" class="end-btn" type="button">날짜 선택</button>
    <button id="sch-save" type="button">저장</button>
  </div>
</div>
<div class="sheet small" id="due-sheet" role="dialog" aria-modal="true">
  <div class="move-cal" id="due-cal"></div>
  <div class="sheet-body">
    <button id="due-save" type="button">선택</button>
  </div>
</div>
<div class="sheet small" id="week-sheet" role="dialog" aria-modal="true">
  <div class="sheet-body">
    <label for="week-input">주차</label>
    <div class="week-row"><input id="week-input" type="text" inputmode="numeric" maxlength="3" placeholder="1" autocomplete="off"><span class="week-unit">주차</span></div>
    <button id="week-save" type="button">저장</button>
  </div>
</div>
<div class="backdrop" id="tl-backdrop"></div>
<div class="sheet small" id="tl-sheet" role="dialog" aria-modal="true">
  <div class="sheet-body">

<script>
/* ===== Google Sheets 동기화 (Apps Script 웹 앱) ===== */
var SYNC_URL = '';                         // (선택) 직접 넣어도 되고, 앱의 왼쪽 위 원을 눌러 입력해도 됨
var SYNC_INTERVAL_MS = 3000;               // 자동 동기화 주기
(function () {
  var KEYS = ['todos', 'subjects', 'archiveItems', 'health', 'timelineCats', 'timelineDone'];
  var DEFAULTS = { todos: [[], [], [], []], subjects: [], archiveItems: [], health: {}, timelineCats: {}, timelineDone: {} };
  var META = 'syncMeta';
  var CFG = 'syncConfig';
  var cfg = { url: SYNC_URL || '' };
  try { var sc = JSON.parse(localStorage.getItem(CFG)); if (sc && sc.url) cfg = { url: sc.url }; } catch (e) {}
  function isUrl(u) { return /^https:\/\//.test(u); }
  var enabled = isUrl(cfg.url);
  var loopId = null;
  var rawSet = Storage.prototype.setItem;
  var meta = { rev: 0, dirty: false, linked: false };
  try { var mm = JSON.parse(localStorage.getItem(META)); if (mm && typeof mm === 'object') meta = mm; } catch (e) {}
  var ver = 0, busy = false, pulling = false, inflight = 0, err = false, applying = false, timer = null, msgTimer = null;

  function saveMeta() { try { rawSet.call(localStorage, META, JSON.stringify(meta)); } catch (e) {} }

  /* ── 상태 원 + 메뉴 ── */
  var st = document.createElement('style');
  st.textContent =
    '#sync-btn{position:fixed;left:6px;top:calc(env(safe-area-inset-top,0px) + 2px);width:28px;height:28px;padding:0;border:none;background:transparent;outline:none;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}' +
    '#sync-btn i{display:block;width:10px;height:10px;border-radius:50%;background:#BA664C}' +
    '#sync-btn.ok i{background:#30a46c}' +
    '#sync-btn.sync i{background:#DBB114;animation:sync-blink .9s ease-in-out infinite}' +
    '@keyframes sync-blink{0%,100%{opacity:1}50%{opacity:.2}}' +
    '#sync-menu{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 34px);width:min(300px,calc(100vw - 16px));box-sizing:border-box;z-index:51;display:none;flex-direction:column;gap:6px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.2)}' +
    '#sync-menu.open{display:flex}' +
    '#sync-menu button{border:none;outline:none;border-radius:999px;padding:10px 16px;background:#e2e2e2;color:#000;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap;text-align:left}' +
    '#sync-menu input{width:100%;box-sizing:border-box;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;outline:none}' +
    '#sync-menu #sync-save{background:var(--accent);color:var(--bg);text-align:center}' +
    '#sync-menu .msg{display:none;font-size:.75rem;color:var(--muted);padding:2px 8px 0;white-space:nowrap}' +
    '#sync-menu .msg.on{display:block}';
  document.head.appendChild(st);

  var btn = document.createElement('button');
  btn.id = 'sync-btn'; btn.type = 'button'; btn.setAttribute('aria-label', '동기화');
  btn.appendChild(document.createElement('i'));
  document.body.appendChild(btn);

  var menu = document.createElement('div');
  menu.id = 'sync-menu';
  menu.innerHTML = '<input id="sync-url" type="url" placeholder="Apps Script 웹 앱 링크 (…/exec)" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="sync-save">연결</button><button type="button" id="sync-up">업로드 (앱 → 시트)</button><button type="button" id="sync-down">다운로드 (시트 → 앱)</button><div class="msg" id="sync-msg"></div>';
  document.body.appendChild(menu);
  var msgEl = menu.querySelector('#sync-msg');
  var urlIn = menu.querySelector('#sync-url');

  function render() {
    btn.className = inflight > 0 ? 'sync' : (enabled && !err && meta.linked && !meta.dirty ? 'ok' : '');
  }
  function say(t) {
    msgEl.textContent = t; msgEl.classList.add('on'); menu.classList.add('open');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { msgEl.classList.remove('on'); menu.classList.remove('open'); }, 2500);
  }
  render();

  /* ── 데이터 ── */
  function snapshot() {
    var o = {};
    KEYS.forEach(function (k) {
      var v = null;
      try { v = JSON.parse(localStorage.getItem(k)); } catch (e) {}
      o[k] = v == null ? DEFAULTS[k] : v;
    });
    return o;
  }
  function isEmptySnap(s) {
    return !(s.todos || []).some(function (l) { return l && l.length; }) &&
      !(s.subjects || []).length && !(s.archiveItems || []).length &&
      !Object.keys(s.health || {}).length && !Object.keys(s.timelineCats || {}).length &&
      !Object.keys(s.timelineDone || {}).length;
  }
  function uiBusy() {
    var a = document.activeElement;
    return !!document.querySelector('.sheet.open, .subject-page.open, #sync-menu.open') ||
      (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
  }

  // 앱이 저장할 때마다 변경 표시 → 잠시 후 시트로 업로드
  Storage.prototype.setItem = function (k, v) {
    rawSet.call(this, k, v);
    if (enabled && this === window.localStorage && !applying && KEYS.indexOf(k) !== -1) {
      meta.dirty = true; ver++; saveMeta(); render(); schedule();
    }
  };
  function schedule() { clearTimeout(timer); timer = setTimeout(function () { push(false); }, 1500); }

  /* ── 업로드 ── */
  function push(force) {
    if (!enabled) return Promise.resolve();
    if (!force && !meta.dirty) return Promise.resolve();
    if (busy || pulling) { schedule(); return Promise.resolve(); }
    busy = true; inflight++;
    var v = ver;
    render();
    return fetch(cfg.url, { method: 'POST', redirect: 'follow', body: JSON.stringify({ data: snapshot() }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error || 'fail');
        meta.rev = res.updatedAt; meta.linked = true;
        if (v === ver) meta.dirty = false;
        saveMeta(); err = false;
        if (v !== ver) schedule();
      })
      .catch(function () { err = true; })
      .then(function () { busy = false; inflight--; render(); });
  }

  /* ── 다운로드 ── */
  function apply(data, rev) {
    applying = true;
    KEYS.forEach(function (k) {
      var v = data && data[k] != null ? data[k] : DEFAULTS[k];
      rawSet.call(localStorage, k, JSON.stringify(v));
    });
    applying = false;
    meta.rev = rev; meta.linked = true; meta.dirty = false;
    saveMeta();
    location.reload();
  }
  function pull(manual) {
    if (!enabled || pulling || busy) return;
    if (!manual && meta.dirty) { push(false); return; }
    pulling = true; inflight++;
    render();
    var needPush = false;
    var url = cfg.url + (cfg.url.indexOf('?') < 0 ? '?' : '&') + 'since=' + ((!manual && meta.linked) ? meta.rev : 0) + '&_=' + Date.now();
    fetch(url, { redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error || 'fail');
        err = false;
        if (res.unchanged) return;
        var local = snapshot();
        if (manual) {
          if (res.empty) { say('시트가 비어 있어요'); return; }
          apply(res.data, res.updatedAt);
          return;
        }
        // 처음 연결이거나 시트가 비어 있으면 → 이 기기 데이터를 시트로 올림
        if ((!meta.linked && !isEmptySnap(local)) || (res.empty && !isEmptySnap(local))) {
          meta.dirty = true; saveMeta(); needPush = true; return;
        }
        if (res.empty) { meta.rev = res.updatedAt; meta.linked = true; saveMeta(); return; }
        if (uiBusy()) return;             // 입력 중이면 다음 주기에 반영
        apply(res.data, res.updatedAt);
      })
      .catch(function () { err = true; })
      .then(function () {
        pulling = false; inflight--; render();
        if (needPush) push(false);
      });
  }

  /* ── 자동(3초) · 수동 ── */
  function tick() {
    if (!enabled || document.visibilityState !== 'visible') return;
    if (meta.dirty) push(false); else pull(false);
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    msgEl.classList.remove('on');
    if (!menu.classList.contains('open')) { urlIn.value = enabled ? cfg.url : ''; }
    menu.classList.toggle('open');
  });
  document.addEventListener('click', function (e) {
    if (!menu.contains(e.target)) menu.classList.remove('open');
  });
  document.getElementById('sync-up').addEventListener('click', function () {
    if (!enabled) { say('먼저 링크를 연결하세요'); return; }
    if (isEmptySnap(snapshot())) { say('이 기기에 데이터가 없어요'); return; }
    menu.classList.remove('open');
    push(true);
  });
  document.getElementById('sync-down').addEventListener('click', function () {
    if (!enabled) { say('먼저 링크를 연결하세요'); return; }
    menu.classList.remove('open');
    pull(true);
  });

  document.getElementById('sync-save').addEventListener('click', function () {
    var u = urlIn.value.trim();
    if (!u) {
      try { localStorage.removeItem(CFG); } catch (e) {}
      cfg = { url: SYNC_URL || '' };
      enabled = isUrl(cfg.url);
      render(); say('연결을 해제했어요');
      return;
    }
    if (!isUrl(u)) { say('https:// 로 시작하는 링크를 넣어주세요'); return; }
    var changed = u !== cfg.url;
    cfg = { url: u };
    try { rawSet.call(localStorage, CFG, JSON.stringify(cfg)); } catch (e) {}
    enabled = true;
    if (changed) { meta = { rev: 0, dirty: false, linked: false }; saveMeta(); err = false; }
    render(); startLoop(); say('연결했어요');
    pull(false);
  });
  function startLoop() { if (!loopId) loopId = setInterval(tick, SYNC_INTERVAL_MS); }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') tick();
    else if (enabled && meta.dirty) { clearTimeout(timer); push(false); }
  });
  window.addEventListener('online', tick);
  window.addEventListener('pagehide', function () { if (enabled && meta.dirty) push(false); });
  startLoop();
  if (enabled) pull(false);
})();
</script>
<script>
var tabs = document.querySelectorAll('nav button');
var panels = document.querySelectorAll('.panel');
tabs.forEach(function (b, i) {
  b.addEventListener('click', function () {
    tabs.forEach(function (x) {
      x.setAttribute('aria-selected', x === b ? 'true' : 'false');
    });
    panels.forEach(function (p, j) {
      p.classList.toggle('active', i === j);
    });
    document.getElementById('study-fab').classList.toggle('show', i === 3);
    document.getElementById('archive-fab').classList.toggle('show', i === 4);
  });
});
var archiveBackdrop = document.getElementById('archive-backdrop');
var archiveSheet = document.getElementById('archive-sheet');
var archiveActSheet = document.getElementById('archive-act-sheet');
var archiveConfirmSheet = document.getElementById('archive-confirm-sheet');
var archiveItems = [];
try {
  var savedArchive = JSON.parse(localStorage.getItem('archiveItems'));
  if (Array.isArray(savedArchive)) archiveItems = savedArchive;
} catch (e) {}
var archiveEditing = null;
function persistArchive() {
  try { localStorage.setItem('archiveItems', JSON.stringify(archiveItems)); } catch (e) {}
}
function renderArchive() {
  var box = document.getElementById('archive-list');
  box.innerHTML = '';
  archiveItems.forEach(function (it) {
    var item = document.createElement('div');
    item.className = 'tl-done-item';
    var t = document.createElement('div');
    t.className = 'tl-done-title';
    t.textContent = it.title;
    item.appendChild(t);
    if (it.memo) {
      var m = document.createElement('div');
      m.className = 'tl-done-memo';
      m.textContent = it.memo;
      item.appendChild(m);
    }
    item.addEventListener('click', function () {
      archiveEditing = it;
      archiveActSheet.classList.add('open');
      archiveBackdrop.classList.add('open');
    });
    box.appendChild(item);
  });
}
function setArchiveSheet(open) {
  archiveBackdrop.classList.toggle('open', open);
  archiveSheet.classList.toggle('open', open);
}
function closeArchiveAll() {
  archiveSheet.classList.remove('open');
  archiveActSheet.classList.remove('open');
  archiveConfirmSheet.classList.remove('open');
  archiveBackdrop.classList.remove('open');
}
document.getElementById('archive-fab').addEventListener('click', function () {
  archiveEditing = null;
  document.getElementById('archive-title').value = '';
  document.getElementById('archive-memo').value = '';
  setArchiveSheet(true);
});
function saveArchive() {
  var title = document.getElementById('archive-title').value.trim();
  if (!title) return;
  var memo = document.getElementById('archive-memo').value.trim();
  if (archiveEditing) {
    archiveEditing.title = title;
    archiveEditing.memo = memo;
  } else {
    archiveItems.push({ title: title, memo: memo });
  }
  archiveEditing = null;
  persistArchive();
  renderArchive();
  closeArchiveAll();
}
document.getElementById('archive-save').addEventListener('click', saveArchive);
document.getElementById('archive-title').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  saveArchive();
});
document.getElementById('archive-act-edit').addEventListener('click', function () {
  if (!archiveEditing) return;
  document.getElementById('archive-title').value = archiveEditing.title;
  document.getElementById('archive-memo').value = archiveEditing.memo || '';
  archiveActSheet.classList.remove('open');
  archiveSheet.classList.add('open');
});
document.getElementById('archive-act-today').addEventListener('click', function () {
  var target = archiveEditing;
  if (!target) return;
  todos[3].push({
    title: target.title,
    memo: target.memo || '',
    memoOpen: !!target.memo,
    time: null,
    timeOpen: false,
    repeat: null,
    repeatOpen: false,
    date: dateKey(new Date())
  });
  try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
  archiveItems = archiveItems.filter(function (it) { return it !== target; });
  archiveEditing = null;
  persistArchive();
  renderArchive();
  renderTodos();
  closeArchiveAll();
});
document.getElementById('archive-act-delete').addEventListener('click', function () {
  archiveConfirmSheet.classList.add('open');
});
document.getElementById('archive-confirm-cancel').addEventListener('click', function () {
  archiveConfirmSheet.classList.remove('open');
});
document.getElementById('archive-confirm-delete').addEventListener('click', function () {
  var target = archiveEditing;
  archiveItems = archiveItems.filter(function (it) { return it !== target; });
  archiveEditing = null;
  persistArchive();
  renderArchive();
  closeArchiveAll();
});
archiveBackdrop.addEventListener('click', function () {
  var top = [archiveConfirmSheet, archiveActSheet, archiveSheet].filter(function (el) { return el.classList.contains('open'); })[0];
  if (top) top.classList.remove('open');
  if (![archiveConfirmSheet, archiveActSheet, archiveSheet].some(function (el) { return el.classList.contains('open'); })) {
    archiveBackdrop.classList.remove('open');
  }
});
renderArchive();
var studySheet = document.getElementById('study-sheet');

  y: now.getFullYear(),

};
var DOW = ['일', '월', '화', '수', '목', '금', '토'];

function same(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function shiftMonth(d) {
  var t = new Date(state.y, state.m + d, 1);
  state.y = t.getFullYear();
  state.m = t.getMonth();
  renderAll();
}

function render(root) {
  root.innerHTML = '';
  var head = document.createElement('div');
  head.className = 'cal-head';
  var prev = document.createElement('button');
  prev.textContent = '‹';
  prev.setAttribute('aria-label', '이전 달');
  prev.onclick = function () { shiftMonth(-1); };
  var next = document.createElement('button');
  next.textContent = '›';
  next.setAttribute('aria-label', '다음 달');
  next.onclick = function () { shiftMonth(1); };
  var title = document.createElement('div');
  title.className = 'cal-title';
  title.textContent = state.y + '년 ' + (state.m + 1) + '월';
  head.appendChild(prev);
  head.appendChild(title);
  head.appendChild(next);
  root.appendChild(head);

  var grid = document.createElement('div');
  grid.className = 'cal-grid';
  DOW.forEach(function (d) {
    var c = document.createElement('div');
    c.className = 'cal-dow';
    c.textContent = d;
    grid.appendChild(c);
  });
  var first = new Date(state.y, state.m, 1).getDay();
  var days = new Date(state.y, state.m + 1, 0).getDate();
  for (var i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
  var today = new Date();
  for (var d = 1; d <= days; d++) {
    (function (d) {
      var date = new Date(state.y, state.m, d);
      var btn = document.createElement('button');
      btn.className = 'cal-day';
      if (same(date, today)) btn.classList.add('today');
      if (same(date, state.sel)) btn.classList.add('sel');
      btn.textContent = d;
      btn.onclick = function () { state.sel = date; renderAll(); renderTodos(); renderWeight(); renderTimelinePast(); if (window.renderTimelineCats) window.renderTimelineCats(); };
      grid.appendChild(btn);
    })(d);
  }
  root.appendChild(grid);
}

}

function validTime(s) {
  return /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
}
function fmtTime(el) {
  var d = el.value.replace(/\D/g, '').slice(0, 4);
  if (d.length >= 2 && +d.slice(0, 2) > 23) d = '23' + d.slice(2);
  if (d.length >= 3 && +d.charAt(2) > 5) d = d.slice(0, 2) + '5' + d.slice(3);
  el.value = d.length > 2 ? d.slice(0, 2) + ':' + d.slice(2) : d;
}
function normTime(s) {
  var d = s.replace(/\D/g, '').slice(0, 4);
  if (!d) return '';
  var hh, mm;
  if (d.length === 1) { hh = '0' + d; mm = '00'; }
  else if (d.length === 2) { hh = d; mm = '00'; }
  else if (d.length === 3) { hh = d.slice(0, 2); mm = d.charAt(2) + '0'; }
  else { hh = d.slice(0, 2); mm = d.slice(2); }
  if (+hh > 23) hh = '23';
  if (+mm > 59) mm = '59';
  return hh + ':' + mm;
}
function updateTimeWarn() {
  var ts = document.getElementById('time-start').value;
  var te = document.getElementById('time-end').value;
  var warn = document.getElementById('time-warn');
  warn.textContent = (validTime(ts) && validTime(te) && te < ts) ? '종료 시간이 시작 시간보다 빠릅니다.' : '';
}

var CAT_COLORS = ['#BA664C', '#262D82', '#DBB114', '#7C33B0'];

var justDragged = false;

function isRepeating(t) {
  return t.repeatOpen === true && t.repeat && t.repeat.days && t.repeat.days.length > 0 && !!t.repeat.end;
}
function occursOn(t, key) {
  if (t.exceptions && t.exceptions[key]) return false;
  if (t.date === key) return true;
  if (isRepeating(t) && key > t.date && key <= t.repeat.end) {
    return t.repeat.days.indexOf(parseKey(key).getDay()) !== -1;
  }
  return false;
}
function isDone(t, key) {
  if (isRepeating(t)) return !!(t.doneMap && t.doneMap[key]);
  return !!t.done;
}
function setDone(t, key, v) {
  if (isRepeating(t)) {
    t.doneMap = t.doneMap || {};
    if (v) t.doneMap[key] = true; else delete t.doneMap[key];
  } else {
    t.done = v;
  }
}
var dragging = null;

function commitOrder(box, cat) {
  var ordered = Array.prototype.map.call(box.children, function (r) { return r._t; });
  var arr = todos[cat];
  var slots = [];
  arr.forEach(function (t, k) { if (ordered.indexOf(t) !== -1) slots.push(k); });
  slots.forEach(function (k, j) { arr[k] = ordered[j]; });
  try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (err) {}
  renderTodos();
}

function attachDrag(row, box, cat) {
  row.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest('.todo-check')) return;
    var startX = e.clientX;
    var startY = e.clientY;
    var timer = null;
    var active = false;
    var grab = 0;

    function cleanup() {
      clearTimeout(timer);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onEnd);
      document.removeEventListener('pointercancel', onEnd);
    }
    function move(y) {
      row.style.transform = '';
      var h = row.offsetHeight;
      var d = !!row._done;
      var group = Array.prototype.filter.call(box.children, function (r) { return !!r._done === d; });
      var groupTop = group[0].getBoundingClientRect().top;
      var groupBottom = group[group.length - 1].getBoundingClientRect().bottom;
      var desiredTop = Math.max(groupTop, Math.min(groupBottom - h, y - grab));
      var center = desiredTop + h / 2;
      var prev = row.previousElementSibling;
      var next = row.nextElementSibling;
      while (prev && center < prev.getBoundingClientRect().top + prev.offsetHeight / 2) {
        box.insertBefore(row, prev);
        prev = row.previousElementSibling;
      }
      while (next && center > next.getBoundingClientRect().top + next.offsetHeight / 2) {
        box.insertBefore(next, row);
        next = row.nextElementSibling;

/*
 * 타임라인 구조 (시간표)
 *   - 한 줄(행)  = 1시간  → 24줄 (00시 ~ 23시)
 *   - 원 1개(칸) = 10분   → 한 줄에 6개 (:00 :10 :20 :30 :40 :50)
 *   - 세로선으로 나눈 조각 1개 = 1분 → 원 1개에 10조각 (10분 / 10 = 1분)
 *   → 24시간 × 60분 = 1440분 = 144개 원 × 10조각
 * data-minute 는 하루 중 몇 번째 분인지(0 ~ 1439)를 뜻한다.
 */
var HOURS_PER_DAY = 24;

var SEGMENTS_PER_CELL = 10;   // 원 1개 = 10조각

  for (var h = 0; h < HOURS_PER_DAY; h++) {

    lab.textContent = (h < 10 ? '0' : '') + h;
    g.appendChild(lab);
    for (var c = 0; c < CELLS_PER_HOUR; c++) {
      var cell = document.createElement('div');
      cell.className = 'tl-cell';
      cell.dataset.hour = h;
      cell.dataset.startMinute = c * MINUTES_PER_CELL;   // 이 원이 시작하는 분 (0,10,...,50)
      for (var k = 0; k < SEGMENTS_PER_CELL; k++) {
        var seg = document.createElement('div');
        seg.className = 'tl-seg';
        // 하루 기준 분 번호: 시간*60 + 원 시작 분 + 조각 번호*1분
        seg.dataset.minute = h * 60 + c * MINUTES_PER_CELL + k * MINUTES_PER_SEGMENT;
        cell.appendChild(seg);
      }
      g.appendChild(cell);
    }
  }

    todos[editing.cat][editing.idx].timeOpen = timeOpenInput;
    todos[editing.cat][editing.idx].repeat = repeatVal;
    todos[editing.cat][editing.idx].repeatOpen = repeatOpenInput;
  } else {
    todos[currentCat].push({ title: title, memo: memoEl.value.trim(), memoOpen: memoOpenInput, time: timeVal, timeOpen: timeOpenInput, repeat: repeatVal, repeatOpen: repeatOpenInput, date: dateKey(state.sel) });
  }
  editing = null;
  try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
  titleEl.value = '';
  memoEl.value = '';
  renderTodos();
  setSheet(false);
});
var detailSheet = document.getElementById('detail-sheet');
function setDetail(open) {
  backdrop.classList.toggle('open', open);
  detailSheet.classList.toggle('open', open);
}
document.getElementById('todo-edit').addEventListener('click', function () {
  if (!selected) return;
  var t = todos[selected.cat][selected.idx];
  if (!t) return;
  editing = { cat: selected.cat, idx: selected.idx, key: selected.key };
  setMemoSwitch(t.memoOpen === true, selected.cat);
  setTimeSwitch(t.timeOpen === true, selected.cat);
  setRepeatSwitch(t.repeatOpen === true);
  repeatDays = t.repeat ? t.repeat.days.slice() : [];
  repeatEnd = t.repeat ? t.repeat.end : '';
  document.getElementById('repeat-warn').textContent = '';
  renderRepeatUI();
  document.getElementById('time-start').value = t.time ? t.time.start : '';
  document.getElementById('time-end').value = t.time ? t.time.end : '';
  updateTimeWarn();
  document.getElementById('todo-title').value = t.title;
  document.getElementById('todo-memo').value = t.memo || '';
  setDetail(false);
  setSheet(true);
});
var confirmSheet = document.getElementById('confirm-sheet');
function setConfirm(open) {
  backdrop.classList.toggle('open', open);
  confirmSheet.classList.toggle('open', open);
}
document.getElementById('todo-delete').addEventListener('click', function () {
  if (!selected) return;
  var dt = todos[selected.cat][selected.idx];
  setDetail(false);
  if (dt && isRepeating(dt)) { openScope('delete'); return; }
  setConfirm(true);
});
document.getElementById('confirm-delete').addEventListener('click', function () {
  if (selected) {
    todos[selected.cat].splice(selected.idx, 1);
    try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
    selected = null;
    renderTodos();
  }
  setConfirm(false);
});
document.getElementById('confirm-cancel').addEventListener('click', function () {
  setConfirm(false);
});

var pendingEdit = null;
var scopeMode = '';
var scopeSheet = document.getElementById('scope-sheet');
function openScope(mode) {
  scopeMode = mode;
  var w = mode === 'edit' ? '수정' : '삭제';
  document.getElementById('scope-msg').textContent = '반복 투두입니다. 어디까지 ' + w + '할까요?';
  document.getElementById('scope-one').textContent = '이 투두만 ' + w;
  document.getElementById('scope-follow').textContent = '이 투두와 앞으로의 투두 ' + w;
  backdrop.classList.add('open');
  scopeSheet.classList.add('open');
}
function closeScope(keepBackdrop) {
  scopeSheet.classList.remove('open');
  if (!keepBackdrop) backdrop.classList.remove('open');
}
function prevKeyOf(key) {
  var d = parseKey(key);
  d.setDate(d.getDate() - 1);
  return dateKey(d);
}
function saveTodos() {
  try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
}
function cutFrom(t, key) {
  ['doneMap', 'exceptions'].forEach(function (f) {
    if (!t[f]) return;
    Object.keys(t[f]).forEach(function (k) { if (k >= key) delete t[f][k]; });
  });
}
function applyRepeatEdit(scope) {
  var p = pendingEdit;
  if (!p || !editing) return;
  var list = todos[editing.cat];
  var t = list[editing.idx];
  var key = editing.key;
  if (!t) return;
  var wasDone = !!(t.doneMap && t.doneMap[key]);
  if (scope === 'one') {
    t.exceptions = t.exceptions || {};
    t.exceptions[key] = true;
    if (t.doneMap) delete t.doneMap[key];
    list.splice(editing.idx + 1, 0, { title: p.title, memo: p.memo, memoOpen: p.memoOpen, time: p.time, timeOpen: p.timeOpen, repeat: null, repeatOpen: false, date: key, done: wasDone });
  } else if (key === t.date) {
    t.title = p.title; t.memo = p.memo; t.memoOpen = p.memoOpen;
    t.time = p.time; t.timeOpen = p.timeOpen;
    t.repeat = p.repeat; t.repeatOpen = p.repeatOpen;
    if (!isRepeating(t)) t.done = wasDone;
  } else {
    var nt = { title: p.title, memo: p.memo, memoOpen: p.memoOpen, time: p.time, timeOpen: p.timeOpen, repeat: p.repeat, repeatOpen: p.repeatOpen, date: key };
    if (t.doneMap) {
      nt.doneMap = {};
      Object.keys(t.doneMap).forEach(function (k) { if (k >= key) nt.doneMap[k] = t.doneMap[k]; });
    }
    if (t.exceptions) {
      nt.exceptions = {};
      Object.keys(t.exceptions).forEach(function (k) { if (k >= key) nt.exceptions[k] = true; });
    }
    if (!isRepeating(nt)) nt.done = wasDone;
    t.repeat = { days: t.repeat.days, end: prevKeyOf(key) };
    cutFrom(t, key);
    list.splice(editing.idx + 1, 0, nt);
  }
  editing = null;
  pendingEdit = null;
  saveTodos();
  document.getElementById('todo-title').value = '';
  document.getElementById('todo-memo').value = '';
  renderTodos();
  closeScope(false);
  setSheet(false);
}
function applyRepeatDelete(scope) {
  if (!selected) return;
  var list = todos[selected.cat];
  var t = list[selected.idx];
  var key = selected.key;
  if (t) {
    if (scope === 'one') {
      t.exceptions = t.exceptions || {};
      t.exceptions[key] = true;
      if (t.doneMap) delete t.doneMap[key];
    } else if (key === t.date) {
      list.splice(selected.idx, 1);
    } else {
      t.repeat = { days: t.repeat.days, end: prevKeyOf(key) };
      cutFrom(t, key);
    }
  }
  selected = null;
  saveTodos();
  renderTodos();
  closeScope(false);
}
function scopeChoose(scope) {
  if (scopeMode === 'edit') applyRepeatEdit(scope); else applyRepeatDelete(scope);
}
document.getElementById('scope-one').addEventListener('click', function () { scopeChoose('one'); });
document.getElementById('scope-follow').addEventListener('click', function () { scopeChoose('follow'); });
document.getElementById('scope-cancel').addEventListener('click', function () {
  pendingEdit = null;
  closeScope(scopeMode === 'edit');
});

function parseKey(k) {
  var p = k.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
var mv = { y: now.getFullYear(), m: now.getMonth(), sel: new Date(now.getFullYear(), now.getMonth(), now.getDate()) };
function shiftMoveMonth(d) {
  var t = new Date(mv.y, mv.m + d, 1);
  mv.y = t.getFullYear();
  mv.m = t.getMonth();
  renderMoveCal();
}
function renderMoveCal() {
  var root = document.getElementById('move-cal');
  root.innerHTML = '';
  var head = document.createElement('div');
  head.className = 'cal-head';
  var prev = document.createElement('button');
  prev.textContent = '‹';
  prev.setAttribute('aria-label', '이전 달');
  prev.onclick = function () { shiftMoveMonth(-1); };
  var next = document.createElement('button');
  next.textContent = '›';
  next.setAttribute('aria-label', '다음 달');
  next.onclick = function () { shiftMoveMonth(1); };
  var title = document.createElement('div');
  title.className = 'cal-title';
  title.textContent = mv.y + '년 ' + (mv.m + 1) + '월';
  head.appendChild(prev);
  head.appendChild(title);
  head.appendChild(next);
  root.appendChild(head);
  var grid = document.createElement('div');
  grid.className = 'cal-grid';
  DOW.forEach(function (d) {
    var c = document.createElement('div');
    c.className = 'cal-dow';
    c.textContent = d;
    grid.appendChild(c);
  });
  var first = new Date(mv.y, mv.m, 1).getDay();
  var days = new Date(mv.y, mv.m + 1, 0).getDate();
  for (var i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
  var today = new Date();
  for (var d = 1; d <= days; d++) {
    (function (d) {
      var date = new Date(mv.y, mv.m, d);
      var btn = document.createElement('button');
      btn.className = 'cal-day';
      if (same(date, today)) btn.classList.add('today');
      if (same(date, mv.sel)) btn.classList.add('sel');
      btn.textContent = d;
      btn.onclick = function () { mv.sel = date; renderMoveCal(); };
      grid.appendChild(btn);
    })(d);
  }
  root.appendChild(grid);
}

var moveSheet = document.getElementById('move-sheet');
function setMove(open) {
  backdrop.classList.toggle('open', open);
  moveSheet.classList.toggle('open', open);
}
document.getElementById('todo-move').addEventListener('click', function () {
  if (!selected) return;
  var t = todos[selected.cat][selected.idx];
  if (!t) return;
  var cur = parseKey(t.date || dateKey(state.sel));
  mv.sel = cur;
  mv.y = cur.getFullYear();
  mv.m = cur.getMonth();
  renderMoveCal();
  setDetail(false);
  setMove(true);
});
document.getElementById('move-save').addEventListener('click', function () {
  var val = dateKey(mv.sel);
  if (!selected) return;
  var t = todos[selected.cat][selected.idx];
  if (t) {
    t.date = val;
    try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
    renderTodos();
  }
  selected = null;
  setMove(false);
});
var catSheet = document.getElementById('cat-sheet');
function setCat(open) {
  backdrop.classList.toggle('open', open);
  catSheet.classList.toggle('open', open);
}
document.getElementById('todo-cat').addEventListener('click', function () {
  if (!selected) return;
  var t = todos[selected.cat][selected.idx];
  if (!t) return;
  var list = document.getElementById('cat-list');
  list.innerHTML = '';
  document.querySelectorAll('#todo-pills .pill').forEach(function (pill, ci) {
    var name = pill.querySelector('.pill-label').textContent.trim();
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat-item' + (ci === selected.cat ? ' on' : '');
    var dot = document.createElement('i');
    dot.className = 'dot';
    dot.style.background = CAT_COLORS[ci];
    b.appendChild(dot);
    b.appendChild(document.createTextNode(name));
    b.addEventListener('click', function () {
      if (!selected) return;
      if (ci !== selected.cat) {
        var item = todos[selected.cat][selected.idx];
        if (item) {
          todos[selected.cat].splice(selected.idx, 1);
          todos[ci].push(item);
          try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
          renderTodos();
        }
      }
      selected = null;
      setCat(false);
    });
    list.appendChild(b);
  });
  setDetail(false);
  setCat(true);
});
backdrop.addEventListener('click', function () {
  setSheet(false);
  setDetail(false);
  setConfirm(false);
  setMove(false);
  setCat(false);
  setEnd(false);
  closeScope(false);
  studySheet.classList.remove('open');
});
</script>
</body>
</html>
